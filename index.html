<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Retro Template</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ⭐ TITLE ABOVE NAVIGATION ⭐ -->
    <div class="site-title-container">
        <h1 class="site-title">Un-Design</h1>
        <p class="site-subtitle"> Establishing a Design Justice Pedagogy Collective</p>
    </div>

    <div id="nav-placeholder"></div>

    <div class="full-width-container">

        <div class="image-container">
            <img src="assets/images/full_width_section/Cutting_Mat.png" 
                 class="base-image" 
                 alt="Banner Image">

            <a href="https://example.com" class="overlay overlay-polaroid">
                <img src="assets/images/full_width_section/polaroid.png" alt="Overlay 1">
            </a>

            <a href="https://example.com/second" class="overlay overlay-note">
                <img src="assets/images/full_width_section/stickynote.png" alt="Overlay 2">
            </a>
        </div>

        <h2>Desktop:</h2>
        <p>Whats currently on the table for Un-Design.</p>

    </div>

    <div class="grid-container">
        <div id="left-sidebar-placeholder"></div>

        <main class="main-content">
            <div class="main-content-box">
                <img src="/assets/images/banners/800width_sample.jpg" alt="800 width sample">
            </div>
        </main>

        <div id="right-sidebar-placeholder"></div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="mainscripts.js"></script>
</body>
</html>
